<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rift Wizard 3 — Spell & Equipment Compendium</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="title">
    <h1>Rift Wizard 3 Compendium</h1>
    <p class="sub">Last Updated: <span id="last-updated">—</span><label class="version-picker hidden" id="version-picker"> · Version <select id="version-select"></select></label> · <a href="#recent" id="recent-link">View recent changes</a></p>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="equipment" class="active">Equipment</button>
    <button data-tab="components">Components</button>
    <button data-tab="spells">Spells</button>
    <button data-tab="monsters">Monsters</button>
    <button data-tab="costumes" id="tabbtn-costumes">Costumes</button>
    <button data-tab="guide">Guide</button>
  </nav>
</header>

<main>
  <!-- EQUIPMENT -->
  <section id="tab-equipment" class="tab-panel active">
    <div class="eq-pool hidden" id="eq-pool"></div>
    <div class="build hidden" id="build">
      <div class="build-head">
        <span class="wl-title">Wishlist <span class="wl-badge" id="wl-count">0</span></span>
        <div class="build-summary" id="build-summary"></div>
        <div class="wl-actions">
          <button id="wl-auto" class="btn-ghost" title="Automatically assign your components to build items">✨ Auto assign</button>
          <button id="wl-clearbuilt" class="btn-primary" title="Craft the finished items, consuming the components used to make them">Craft</button>
          <!-- Build sharing now lives in the Guide tab; the equipment build itself
               persists locally (localStorage), so there's no per-build link here. -->
          <button id="wl-clear" class="btn-ghost">Clear</button>
        </div>
      </div>
      <div class="build-body">
        <div class="build-items" id="build-items"></div>
      </div>
    </div>
    <div class="controls">
      <input type="search" id="eq-search" class="search" placeholder="Search equipment by name or effect…">
      <div class="control-group">
        <label>Slot</label>
        <div class="chips" id="eq-slots"></div>
      </div>
      <div class="control-group">
        <!-- Two ways to read a tag: the item's own tags vs the tags its recipe
             consumes. They differ (e.g. Holy: 47 items carry it, 53 craft from it). -->
        <div class="segmented" id="eq-tagmode" data-mode="item" role="radiogroup" aria-label="Tag filter mode">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" class="seg-opt active" data-mode="item" role="radio" aria-checked="true"
                  title="Show equipment that carries the selected tag">Equipment has tag</button>
          <button type="button" class="seg-opt" data-mode="recipe" role="radio" aria-checked="false"
                  title="Show equipment whose recipe consumes the selected tag">Recipe uses tag</button>
        </div>
        <div class="chips" id="eq-tags"></div>
      </div>
      <div class="control-group">
        <label>Components</label>
        <button class="toggle" id="eq-craftable" title="Show only equipment you can craft with your current components (set on the Components tab)">Craftable only</button>
      </div>
      <div class="control-group">
        <label>Sort</label>
        <select id="eq-sort">
          <option value="cost">Recipe cost ↑</option>
          <option value="cost-desc">Recipe cost ↓</option>
          <option value="name">Name A–Z</option>
          <option value="slot">Slot</option>
        </select>
      </div>
    </div>
    <div class="active-filters hidden" id="eq-filters"></div>
    <div class="count" id="eq-count"></div>
    <div class="grid" id="eq-grid"></div>
  </section>

  <!-- COMPONENTS -->
  <section id="tab-components" class="tab-panel">
    <div class="controls">
      <input type="search" id="cp-search" class="search" placeholder="Search components by name or effect…">
      <div class="control-group">
        <label>Tier</label>
        <div class="chips" id="cp-tiers"></div>
      </div>
      <div class="control-group">
        <label>Effect</label>
        <div class="chips" id="cp-effects"></div>
      </div>
      <div class="control-group">
        <label>Tag</label>
        <div class="chips" id="cp-tags"></div>
      </div>
    </div>
    <div class="inventory hidden" id="cp-inventory"></div>
    <div class="count" id="cp-count"></div>
    <div class="grid" id="cp-grid"></div>
  </section>

  <!-- SPELLS -->
  <section id="tab-spells" class="tab-panel">
    <div class="controls">
      <input type="search" id="sp-search" class="search" placeholder="Search spells by name or effect…">
      <div class="control-group">
        <label>SP cost</label>
        <div class="chips" id="sp-levels"></div>
      </div>
      <div class="control-group">
        <label>Tag</label>
        <div class="chips" id="sp-tags"></div>
      </div>
    </div>
    <div class="active-filters hidden" id="sp-filters"></div>
    <div class="count" id="sp-count"></div>
    <div class="grid" id="sp-grid"></div>
  </section>

  <!-- MONSTERS -->
  <section id="tab-monsters" class="tab-panel">
    <div class="controls">
      <input type="search" id="mon-search" class="search" placeholder="Search monsters, or type a pool like “wizard”…">
      <div class="control-group">
        <label>Type</label>
        <div class="chips" id="mon-types"></div>
      </div>
      <div class="control-group">
        <label>Movement</label>
        <div class="chips" id="mon-moves"></div>
      </div>
      <div class="control-group">
        <label>Tag</label>
        <div class="chips" id="mon-tags"></div>
      </div>
      <div class="control-group">
        <label>Sort</label>
        <select id="mon-sort">
          <option value="name">Name A–Z</option>
          <option value="depth">Depth ↑</option>
          <option value="hp">HP ↓</option>
        </select>
      </div>
    </div>
    <div class="active-filters hidden" id="mon-filters"></div>
    <div class="count" id="mon-count"></div>
    <div class="grid" id="mon-grid"></div>
  </section>

  <!-- COSTUMES -->
  <section id="tab-costumes" class="tab-panel">
    <div class="controls">
      <input type="search" id="cos-search" class="search" placeholder="Search costumes by name or unlock condition…">
      <div class="control-group">
        <label>Spoilers</label>
        <button class="toggle" id="cos-showall" title="Reveal every costume image">Show all</button>
      </div>
    </div>
    <div class="count" id="cos-count"></div>
    <div class="grid cos-grid" id="cos-grid"></div>
  </section>

  <!-- RECENT CHANGES (reached from the header link, not the tab bar) -->
  <section id="tab-recent" class="tab-panel">
    <div class="recent-head">
      <h2>Recent changes</h2>
    </div>
    <div id="recent-body"></div>
  </section>

  <!-- GUIDE -->
  <section id="tab-guide" class="tab-panel">
    <div id="guide-root" class="guide-root"></div>
  </section>
</main>

<footer>
  <p>Unofficial fan resource. Data &amp; icons © Rift Wizard 3.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
